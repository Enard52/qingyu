name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [gateway, core, contracts, docs / CI]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, requests, and logs. Remove tokens, passwords and personal conversation data.
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, PostgreSQL version, commit SHA
