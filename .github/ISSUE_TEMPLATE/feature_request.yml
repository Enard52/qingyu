name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: boundaries
    attributes:
      label: Design boundaries
      description: Does this touch the Gateway/Core boundary, evidence immutability or fail-closed behaviour? See the "Design thinking" section of the README.
